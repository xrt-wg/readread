# Netlify build configuration
# Version: v1.0.0-internal (env configured)
# Context: branch-deploy for internal-test / beta / release
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
