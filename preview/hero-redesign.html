<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadRead · 首页改版草图</title>
<style>
  :root {
    --bg: #12100c;
    --cream: #f2ead8;
    --gold: #c9a86a;
    --gold-dim: rgba(201, 168, 106, 0.55);
    --text-sub: #b3a895;
    --text-faint: #7d7466;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 氛围光晕：hero 后方一团很克制的暖光 */
  body::before {
    content: "";
    position: fixed;
    left: 50%; top: 46%;
    width: 90vmin; height: 90vmin;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(201,168,106,0.10) 0%, rgba(201,168,106,0.04) 40%, transparent 70%);
    pointer-events: none;
  }

  /* ---------- 导航 ---------- */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 700; letter-spacing: 0.02em;
  }
  .brand .logo {
    width: 34px; height: 34px;
    background: var(--cream);
    border-radius: 8px;
    display: grid; place-items: center;
    color: var(--bg); font-size: 17px;
  }
  .nav-links {
    display: flex; align-items: center; gap: 36px;
    font-size: 13px; letter-spacing: 0.18em;
    color: var(--text-sub);
  }
  .nav-links a { color: inherit; text-decoration: none; cursor: pointer; transition: color .2s; }
  .nav-links a:hover { color: var(--cream); }
  .nav-links .login {
    padding: 8px 20px;
    border: 1px solid rgba(242,234,216,0.25);
    border-radius: 999px;
    color: var(--cream);
  }
  .nav-links .login:hover { border-color: var(--gold); color: var(--gold); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 40px;
    text-align: center;
    flex: 1;                          /* 占满导航与功能区之间的空间 */
    display: flex;
    flex-direction: column;
    justify-content: center;          /* hero 内容垂直居中，留白自然均分 */
    align-items: center;              /* 防止按钮等子元素被拉伸成全宽 */
    width: 100%;
  }

  .quote-mark {
    font-size: 110px;
    line-height: 0;
    color: var(--gold-dim);
    font-family: Georgia, "Times New Roman", serif;
    display: block;
    margin-bottom: 52px;
    transform: translateX(-340px);   /* 明确放在标题左上方，是有意的装饰 */
  }

  .eyebrow {
    font-size: 15px;
    letter-spacing: 0.55em;
    text-indent: 0.55em;             /* 补偿末字间距，保持视觉居中 */
    color: var(--gold);
    margin-bottom: 40px;
  }

  h1 {
    font-size: clamp(44px, 7.2vw, 84px);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.25;
    background: linear-gradient(180deg, #f6efe0 30%, #d8c9a8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 .comma {
    /* 半角窄逗号 + 金色：一句话连成一气，逗号成为点缀 */
    font-family: Georgia, serif;
    font-size: 0.55em;
    color: var(--gold);
    -webkit-text-fill-color: var(--gold);
    vertical-align: 0.08em;
    margin: 0 0.12em;
    letter-spacing: 0;
  }

  .subtitle {
    margin-top: 36px;
    font-size: 17px;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--text-sub);          /* 提亮了：可见但仍是次级 */
  }

  .cta {
    margin-top: 64px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 18px 52px;              /* 加大：与标题的体量匹配 */
    background: var(--cream);
    color: #1a1712;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(242,234,216,0.12), 0 0 80px rgba(201,168,106,0.08);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 50px rgba(242,234,216,0.2), 0 0 100px rgba(201,168,106,0.15);
  }
  .cta .spark { color: var(--gold); text-indent: 0; letter-spacing: 0; }

  /* ---------- 底部：功能锚点，替代孤零零的 slogan ---------- */
  .features {
    margin: 0 auto;
    padding: 0 48px 40px;
    max-width: 900px;
    display: flex;
    justify-content: center;
    gap: 0;
    border-top: 1px solid rgba(242,234,216,0.08);
  }
  .feature {
    flex: 1;
    padding: 32px 24px 0;
    text-align: center;
  }
  .feature + .feature { border-left: 1px solid rgba(242,234,216,0.08); }
  .feature .f-title {
    font-size: 14px;
    letter-spacing: 0.25em;
    text-indent: 0.25em;
    color: var(--cream);
    margin-bottom: 10px;
  }
  .feature .f-desc {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    font-family: Georgia, serif;
    font-style: italic;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <nav>
    <div class="brand">
      <span class="logo">❧</span>
      ReadRead
    </div>
    <div class="nav-links">
      <a>书库</a>
      <a>方法</a>
      <a>关于</a>
      <a class="login">登录</a>
    </div>
  </nav>

  <section class="hero">
    <span class="quote-mark">“</span>
    <p class="eyebrow">你的私人英语阅读空间</p>
    <h1>读你想读<span class="comma">,</span>学你所读</h1>
    <p class="subtitle">你的阅读语境是最好的学习土壤</p>
    <button class="cta"><span class="spark">✦</span>立即体验</button>
  </section>

  <section class="features">
    <div class="feature">
      <p class="f-title">沉浸阅读</p>
      <p class="f-desc">read what you choose</p>
    </div>
    <div class="feature">
      <p class="f-title">语境记词</p>
      <p class="f-desc">learn as you read</p>
    </div>
    <div class="feature">
      <p class="f-title">私人书库</p>
      <p class="f-desc">your own library</p>
    </div>
  </section>

</body>
</html>
